[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mendify"
version = "0.1.0"
description = "Autonomous DevOps framework"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "docker>=7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "click>=8.1",
    "httpx>=0.27",
]

[project.scripts]
mendify = "mendify.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
